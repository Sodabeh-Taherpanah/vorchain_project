name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs widen this only where needed.
permissions:
  contents: read

# A new push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  # Hooks are for local commits only.
  LEFTHOOK: '0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - run: pnpm format:check
      - run: pnpm lint

  pr-title:
    name: PR title (Conventional Commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: pr-title
      # The squash-merge commit uses the PR title (ADR-0009). Passed via env, never inlined,
      # so a crafted title cannot inject shell commands.
      - name: Lint PR title with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - run: pnpm typecheck

  test:
    name: Unit tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: test
      # Coverage thresholds per package (engine 95, parsers 90, web 80) fail this step.
      - run: pnpm coverage
      - name: Bundled sample data matches reference/ (P1-11)
        run: pnpm --filter @vorchain/sample-data check
      - name: Benchmark parse + analyse 20k/100k, fails above 6 s (P1-11)
        run: pnpm bench
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - run: pnpm build

  e2e:
    name: E2E (Playwright, Chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reuses the build job's Turborepo cache, so `test:e2e -> build` is a cache hit.
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @vorchain/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @vorchain/web exec playwright install --with-deps chromium
      - name: Install system dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @vorchain/web exec playwright install-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal-account repo: no GITLEAKS_LICENSE needed. No PR comments (read-only token).
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Non-blocking for now (docs/runbooks/ci.md): a new advisory in a transitive dependency
    # must not block unrelated PRs. The job still shows as failed; Dependabot fixes follow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level=high
