packages:
  - apps/*
  - packages/*

# pnpm reads its own settings from this file; .npmrc keeps the registry and engine-strict
# for npm-compatible tooling.
engineStrict: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
