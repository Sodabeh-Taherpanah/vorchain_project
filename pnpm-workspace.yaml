packages:
  - apps/*
  - packages/*

# pnpm 11+ reads its own settings from this file (.npmrc keeps registry and engine-strict).
engineStrict: true

# pnpm blocks dependency build scripts unless listed here (supply-chain hardening).
# false = never run: these packages ship prebuilt binaries via optionalDependencies,
# so their postinstall scripts are not needed (and native compilation is not wanted in CI).
allowBuilds:
  '@parcel/watcher': false # next-intl message extractor; prebuilt binaries via optional deps
  '@swc/core': false # next-intl message extractor; prebuilt binaries via optional deps
  lefthook: false # hooks are installed by the root `prepare` script instead
  unrs-resolver: false

# pnpm's default minimumReleaseAge rejects versions published in the last day.
# These exact versions were reviewed and pinned by hand (ADR-0002).
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.4'
  - '@turbo/darwin-arm64@2.11.4'
  - '@turbo/linux-64@2.11.4'
  - '@turbo/linux-arm64@2.11.4'
  - '@turbo/windows-64@2.11.4'
  - '@turbo/windows-arm64@2.11.4'
  - turbo@2.11.4
  - '@vitest/coverage-v8@5.0.2'
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - next@16.4.4

# Security overrides (pnpm audit). Remove when the parent package ships a patched range.
overrides:
  handlebars: '>=4.7.10' # via eslint-plugin-boundaries (GHSA-8r5x-fm3f-whwj and related)
  source-map-js: '>=1.2.2' # via postcss (event-loop DoS advisory)
  zod: '~4.6.6' # via eslint-plugin-react-hooks > zod-validation-error (memory exhaustion advisory)
